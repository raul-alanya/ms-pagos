stages:
  - build
  - deploy

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/ms-pagos-0.0.1.war
    expire_in: 1 hour

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - scp target/ms-pagos-0.0.1.war $SSH_USER@$SSH_HOST:/root/ms-pagos.war
    - ssh $SSH_USER@$SSH_HOST "rm -rf /home/backend/ms-pagos-online/ms-pagos-0.0.1.war && mkdir /home/backend/ms-pagos-online/ms-pagos-0.0.1.war && unzip -q /root/ms-pagos.war -d /home/backend/ms-pagos-online/ms-pagos-0.0.1.war && docker restart ms-pagos-online"
  only:
    - main
