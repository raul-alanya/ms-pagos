# =====================================================
# CONFIGURACION EXTERNA - ms-pagos
# Coloca este archivo en la misma carpeta que el WAR
# =====================================================

spring.application.name=ms-pagos
server.port=8080

# --- BASE DE DATOS (MariaDB en servidor) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:9003/db-pagos-online?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SWAGGER / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- MICROSERVICIO CAJA ---
# Actualiza este valor cuando ms-caja este desplegado
ms.caja.url=http://${DB_HOST}:8081
